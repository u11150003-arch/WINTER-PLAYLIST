  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Syne:wght@500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Chocolate Classical Sans';
      src: local('Chocolate Classical Sans'), local('ChocolateClassicalSans'), local('Chocolate Classical Sans Medium');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg: #18191e;
      --deck-bg: #131418;
      --steel: #f4f4f5;
      --steel-dim: #9ca3af;
      --steel-border: #2a2c35;
      --accent-glow: rgba(244, 244, 245, 0.25);
      --star-cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="rgba(255,255,255,0.65)" stroke="rgba(0,0,0,0.5)" stroke-width="0.8" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>') 12 12, pointer;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button, select, input[type="range"], .menu-link-item, .seek-groove, .lyric-row, .brand-title, .threads-link {
      cursor: var(--star-cursor) !important;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: var(--bg) !important;
      color: var(--steel);
      font-family: 'Syne', 'Chocolate Classical Sans', 'Noto Sans TC', sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      background: var(--bg) !important;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
    }

    .admin-star-btn {
      background: none;
      border: none;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 1.15rem;
      line-height: 1;
      transition: all 0.25s ease;
      text-shadow: 0 0 4px rgba(255, 255, 255, 0.2);
    }
    .admin-star-btn:hover, .admin-star-btn:active {
      color: rgba(255, 255, 255, 0.95);
      transform: scale(1.15);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: var(--bg) !important;
    }

    #threejs-box {
      width: 100%;
      height: 52%;
      position: relative;
      touch-action: none;
      cursor: grab;
      background: transparent !important;
    }
    #threejs-box:active {
      cursor: grabbing;
    }

    .info-lyrics-container {
      height: 48%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding: 0 16px;
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    }

    .track-meta {
      text-align: center;
      margin-bottom: 2px;
      z-index: 10;
    }
    .track-meta h1 {
      font-family: 'Orbitron', 'Syne', 'Chocolate Classical Sans', sans-serif;
      font-size: 1.05rem;
      letter-spacing: 1px;
      color: #ffffff;
    }
    .track-meta p {
      font-size: 0.75rem;
      color: var(--steel-dim);
      margin-top: 2px;
      font-family: 'Syne', sans-serif;
      letter-spacing: 1px;
    }

    .lyrics-view {
      width: 100%;
      max-width: 580px;
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px 16px 80px;
      scrollbar-width: none;
    }
    .lyrics-view::-webkit-scrollbar {
      display: none;
    }

    .lyric-row {
      text-align: center;
      color: #6b7280;
      line-height: 1.45;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .lyric-primary {
      font-size: 0.85rem;
      font-family: 'Syne', 'Chocolate Classical Sans', sans-serif;
    }
    .lyric-trans {
      font-size: 0.78rem;
      color: #585c6d;
      font-family: 'Chocolate Classical Sans', sans-serif;
      letter-spacing: 0.5px;
    }

    .lyric-row.active {
      transform: scale(1.02);
    }
    .lyric-row.active .lyric-primary {
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
    }
    .lyric-row.active .lyric-trans {
      color: #e4e4e7;
      font-size: 0.88rem;
      font-weight: 500;
    }

    footer.retro-deck {
      background: var(--deck-bg) !important;
      border-top: 1px solid var(--steel-border);
      box-shadow: 0 -8px 30px rgba(0,0,0,0.5);
      padding: 10px 14px calc(24px + env(safe-area-inset-bottom, 20px));
      z-index: 25;
      width: 100%;
      flex-shrink: 0;
    }

    .timeline-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 480px;
      margin: 0 auto 10px;
      padding: 0 4px;
    }
    .retro-time {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      color: var(--steel-dim);
      min-width: 36px;
    }

    .seek-groove {
      flex: 1;
      height: 24px;
      display: flex;
      align-items: center;
      position: relative;
      touch-action: none;
    }
    .seek-track {
      width: 100%;
      height: 4px;
      background: #23252d;
      border-radius: 2px;
      position: relative;
    }
    .seek-bar {
      height: 100%;
      background: linear-gradient(90deg, #6b7280, #e4e4e7);
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
      position: relative;
    }
    .seek-thumb {
      position: absolute;
      right: -5px;
      top: -4px;
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255,255,255,0.8);
      pointer-events: none;
    }

    .deck-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 480px;
      margin: 0 auto;
      gap: 8px;
      padding: 0 2px;
    }

    .steel-select-group {
      display: flex;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .steel-select {
      background: #1c1d24;
      border: 1px solid #333642;
      color: #e4e4e7;
      font-family: 'Syne', sans-serif !important;
      font-size: 0.7rem;
      letter-spacing: 0.2px;
      font-weight: 600;
      padding: 5px 6px;
      border-radius: 6px;
      outline: none;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    #sel-playlist {
      flex: 0 0 120px;
      min-width: 110px;
    }
    #sel-song {
      flex: 1;
      min-width: 0;
    }

    .steel-select:focus, .steel-select:hover {
      border-color: #555869;
    }
    .steel-select option {
      font-family: 'Syne', sans-serif !important;
      background: #1c1d24;
      color: #fff;
    }

    @media (min-width: 768px) {
      .timeline-strip, .deck-controls {
        max-width: 640px;
      }
      .steel-select {
        font-size: 0.78rem;
        padding: 6px 10px;
      }
      #sel-playlist {
        flex: 0 0 155px;
      }
      #sel-song {
        flex: 0 0 240px;
      }
    }

    .buttons-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .steel-knob-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #2a2c36 0%, #171820 100%);
      border: 1px solid #3e414f;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .steel-knob-btn:active {
      transform: scale(0.92);
    }
    .steel-knob-btn svg {
      width: 14px;
      height: 14px;
      fill: #d1d5db;
    }

    .play-master-btn {
      width: 46px;
      height: 46px;
      background: radial-gradient(circle at 35% 35%, #4b4e5d 0%, #20222a 100%);
      border: 1.5px solid #8b90a0;
      box-shadow: 0 0 12px var(--accent-glow), inset 0 1px 2px rgba(255,255,255,0.25);
    }
    .play-master-btn svg {
      width: 17px;
      height: 17px;
      fill: #ffffff;
    }

    .modal-veil {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-inner {
      background: #181920;
      border: 1px solid #333642;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      font-family: 'Syne', 'Chocolate Classical Sans', sans-serif;
    }
    .modal-inner h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      color: #f4f4f5;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .menu-link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #111216;
      border: 1px solid #282a35;
      border-radius: 8px;
      color: #f4f4f5;
      text-decoration: none;
      font-size: 0.88rem;
      margin-bottom: 8px;
      transition: all 0.2s ease;
    }
    .menu-link-item:hover {
      background: #1d1f27;
      border-color: #4b4e5d;
      transform: translateX(2px);
    }
    .menu-left-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .menu-icon-svg {
      width: 18px;
      height: 18px;
      stroke: #9ca3af;
      stroke-width: 1.75;
      fill: none;
      flex-shrink: 0;
    }
    .menu-arrow-svg {
      width: 14px;
      height: 14px;
      stroke: #6b7280;
      stroke-width: 2;
      fill: none;
    }

    .menu-info-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      background: #121318;
      border: 1px solid #242632;
      border-radius: 8px;
      color: #9ca3af;
      font-size: 0.74rem;
      line-height: 1.45;
      margin-bottom: 8px;
      font-family: 'Chocolate Classical Sans', sans-serif;
    }
    .menu-info-icon {
      width: 15px;
      height: 15px;
      stroke: #6b7280;
      stroke-width: 1.8;
      fill: none;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .threads-link {
      color: #f4f4f5;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .threads-link:hover {
      color: #60a5fa;
    }

    .field-row {
      margin-bottom: 12px;
    }
    .field-row label {
      display: block;
      font-size: 0.78rem;
      color: var(--steel-dim);
      margin-bottom: 4px;
    }
    .field-row input, .field-row textarea, .field-row select {
      width: 100%;
      background: #111216;
      border: 1px solid #2d303a;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      padding: 8px 10px;
      outline: none;
    }
    .field-row textarea {
      font-family: monospace;
      font-size: 0.78rem;
      resize: vertical;
    }
    .btn-steel {
      background: #2b2e3a;
      border: 1px solid #454959;
      color: #fafafa;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid #333642;
      color: #9ca3af;
      padding: 8px 12px;
      border-radius: 6px;
    }
    .song-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: #111216;
      border: 1px solid #242630;
      margin-bottom: 4px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .song-actions {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .btn-act {
      border: none;
      border-radius: 3px;
      padding: 3px 6px;
      font-size: 0.72rem;
    }
    .btn-edit { background: #3b82f6; color: #fff; }
    .btn-del { background: #ef4444; color: #fff; }
    .btn-order { background: #27272a; color: #d4d4d8; border: 1px solid #3f3f46; font-size: 0.7rem; padding: 2px 5px; }
    .btn-order:disabled { opacity: 0.3; cursor: not-allowed; }

    .preview-card-box {
      background: #101115;
      border: 1px dashed #3f4252;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
      cursor: default !important;
      pointer-events: none !important;
    }
    .preview-cover-thumb {
      width: 72px;
      height: 72px;
      border-radius: 4px;
      border: 1px solid #2c2d38;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      cursor: default !important;
      pointer-events: none !important;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <audio id="native-audio" playsinline preload="auto" crossorigin="anonymous"></audio>

  <header>
    <div class="brand-title" id="logo-trigger">WINTER PLAYLIST</div>
    <button class="admin-star-btn" id="btn-open-menu" title="Navigation & Settings">★</button>
  </header>

  <main>
    <div id="threejs-box"></div>
    <div class="info-lyrics-container">
      <div class="track-meta">
        <h1 id="disp-title">Lips</h1>
        <p id="disp-artist">WINTER</p>
      </div>
      <div class="lyrics-view" id="lyrics-scroller"></div>
    </div>
  </main>

  <footer class="retro-deck">
    <div class="timeline-strip">
      <span class="retro-time" id="lbl-curr">00:00</span>
      <div class="seek-groove" id="seek-container">
        <div class="seek-track">
          <div class="seek-bar" id="seek-progress">
            <div class="seek-thumb"></div>
          </div>
        </div>
      </div>
      <span class="retro-time" id="lbl-total">00:00</span>
    </div>

    <div class="deck-controls">
      <div class="steel-select-group">
        <select class="steel-select" id="sel-playlist"></select>
        <select class="steel-select" id="sel-song"></select>
      </div>

      <div class="buttons-group">
        <button class="steel-knob-btn" id="btn-prev" title="上一首">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="steel-knob-btn play-master-btn" id="btn-play" title="播放 / 暫停">
          <svg id="play-svg-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="steel-knob-btn" id="btn-next" title="下一首">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>
  </footer>

  <!-- 右上角導覽選單 -->
  <div class="modal-veil" id="nav-modal">
    <div class="modal-inner" style="max-width: 360px;">
      <h3>WINTER SPACE</h3>
      <div style="display:flex; flex-direction:column; gap:4px; margin-top:14px;">
        
        <div class="menu-link-item" id="menu-btn-reset">
          <div class="menu-left-content">
            <svg class="menu-icon-svg" viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            <div style="font-weight:600;">Reset Playlist 重新整理</div>
          </div>
          <svg class="menu-arrow-svg" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </div>

        <a class="menu-link-item" href="https://u11150003-arch.github.io/2027-winter-bday-desktop/" target="_blank" rel="noopener">
          <div class="menu-left-content">
            <svg class="menu-icon-svg" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <div>
              <div>WINTER Desktop</div>
              <span class="desc">回到桌面</span>
            </div>
          </div>
          <svg class="menu-arrow-svg" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </a>

        <a class="menu-link-item" href="https://u11150003-arch.github.io/winter-cd-player/" target="_blank" rel="noopener">
          <div class="menu-left-content">
            <svg class="menu-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/></svg>
            <div>
              <div>Retro CD Player</div>
              <span class="desc">前往復古CD隨身聽</span>
            </div>
          </div>
          <svg class="menu-arrow-svg" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </a>

        <a class="menu-link-item" href="https://u11150003-arch.github.io/winter-wildwest/" target="_blank" rel="noopener">
          <div class="menu-left-content">
            <svg class="menu-icon-svg" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <div>
              <div>WINTER WILD WEST</div>
              <span class="desc">前往荒野西部視訊</span>
            </div>
          </div>
          <svg class="menu-arrow-svg" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </a>

    function parseLrc(txt) {
      if (!txt) return [];
      const lines = txt.split('\n');
      const result = [];
      let currentItem = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const m = line.match(/\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)/);
        if (m) {
          if (currentItem) result.push(currentItem);
          const t = parseInt(m[1]) * 60 + parseFloat(m[2]);
          currentItem = { time: t, text: m[3] || '', trans: '' };
        } else if (currentItem && !currentItem.trans) {
          currentItem.trans = line;
        }
      }
      if (currentItem) result.push(currentItem);
      return result.sort((a,b) => a.time - b.time);
    }

    function formatLrcTime(sec) {
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(2);
      return `[${String(m).padStart(2,'0')}:${String(s).padStart(5,'0')}]`;

    function normalizeImageUrl(url) {
      if (!url) return '';
      url = url.trim();
      const driveMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || 
                         url.match(/id=([a-zA-Z0-9_-]+)/) || 
                         url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch) return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
      if (url.includes('dropbox.com')) return url.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '');
      if (url.includes('imgur.com') && !url.includes('i.imgur.com')) {
        const id = url.split('/').pop().split('.')[0];
        return `https://i.imgur.com/${id}.jpg`;
      }
      if (url.includes('github.com') && url.includes('/blob/')) {
        return url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
      }
      return url;
    }

    function createShadowCanvas() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(256, 256, 30, 256, 256, 240);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0.7)');
      grad.addColorStop(0.5, 'rgba(0, 0, 0, 0.3)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);
      return new THREE.CanvasTexture(c);
    }
    const shadowGeo = new THREE.PlaneGeometry(3.8, 2.8);
    const shadowMat = new THREE.MeshBasicMaterial({
      map: createShadowCanvas(),
      transparent: true,
      opacity: 0.85,

    });
    const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
    shadowMesh.position.set(0.1, -0.05, -0.15);
    turntableGroup.add(shadowMesh);

    function createGrooveVinylTexture() {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#0f1014';
      ctx.fillRect(0, 0, 1024, 1024);

      const grad = ctx.createConicGradient(0, 512, 512);
      grad.addColorStop(0.00, 'rgba(15, 16, 20, 1)');
      grad.addColorStop(0.12, 'rgba(65, 68, 80, 0.65)');
      grad.addColorStop(0.25, 'rgba(15, 16, 20, 1)');
      grad.addColorStop(0.50, 'rgba(15, 16, 20, 1)');
      grad.addColorStop(0.62, 'rgba(65, 68, 80, 0.65)');
      grad.addColorStop(0.75, 'rgba(15, 16, 20, 1)');
      grad.addColorStop(1.00, 'rgba(15, 16, 20, 1)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(512, 512, 500, 0, Math.PI * 2);
      ctx.fill();

      for (let r = 85; r < 496; r += 2.2) {
        ctx.beginPath();
        ctx.arc(512, 512, r, 0, Math.PI * 2);
        if (r % 14 === 0) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
          ctx.lineWidth = 1.2;
        } else {
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
          ctx.lineWidth = 0.8;
        }
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(512, 512, 496, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tex;
    }

    const texLoader = new THREE.TextureLoader();

    const coverGeo = new THREE.BoxGeometry(2.0, 2.0, 0.05);
    const coverSideMat = [

    const VINYL_REST_X = 0.52;

    function setupHighQualityTexture(tex) {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.needsUpdate = true;
    }

    function sampleEdgeColorAndApplySides(img) {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.width || 64;
        canvas.height = img.height || 64;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const leftPixel = ctx.getImageData(2, Math.floor(canvas.height / 2), 1, 1).data;
        const leftColor = new THREE.Color(leftPixel[0]/255, leftPixel[1]/255, leftPixel[2]/255);

        const topPixel = ctx.getImageData(Math.floor(canvas.width / 2), 2, 1, 1).data;
        const topColor = new THREE.Color(topPixel[0]/255, topPixel[1]/255, topPixel[2]/255);

        const btmPixel = ctx.getImageData(Math.floor(canvas.width / 2), canvas.height - 3, 1, 1).data;
        const btmColor = new THREE.Color(btmPixel[0]/255, btmPixel[1]/255, btmPixel[2]/255);

        const rightPixel = ctx.getImageData(canvas.width - 3, Math.floor(canvas.height / 2), 1, 1).data;
        const rightColor = new THREE.Color(rightPixel[0]/255, rightPixel[1]/255, rightPixel[2]/255);

        coverMesh.material[0].color.copy(rightColor);
        coverMesh.material[1].color.copy(leftColor);
        coverMesh.material[2].color.copy(topColor);
        coverMesh.material[3].color.copy(btmColor);

        for (let i = 0; i < 4; i++) {
          coverMesh.material[i].needsUpdate = true;
        }
      } catch (err) {
        const fallbackColor = new THREE.Color(0x0c0e14);
        for (let i = 0; i < 4; i++) {
          coverMesh.material[i].color.copy(fallbackColor);
          coverMesh.material[i].needsUpdate = true;
        }
      }
    }

    function applyCoverTo3D(frontUrl, backUrl, labelUrl, scale = 1.0, ox = 0.0, oy = 0.0) {
      if (!frontUrl) return;
      const directFront = normalizeImageUrl(frontUrl);
      const directBack = backUrl ? normalizeImageUrl(backUrl) : directFront;
      const directLabel = labelUrl ? normalizeImageUrl(labelUrl) : directFront;

      texLoader.load(directFront, (tex) => {
        setupHighQualityTexture(tex);
        tex.repeat.set(1 / scale, 1 / scale);
        tex.offset.set(
          (1 - 1/scale)/2 - (ox / scale),
          (1 - 1/scale)/2 - (oy / scale)
        );
        coverMesh.material[4].map = tex;
        coverMesh.material[4].needsUpdate = true;
        sampleEdgeColorAndApplySides(tex.image);
      });

      texLoader.load(directBack, (tex) => {
        setupHighQualityTexture(tex);
        coverMesh.material[5].map = tex;
        coverMesh.material[5].needsUpdate = true;
      });

      texLoader.load(directLabel, (tex) => {
        setupHighQualityTexture(tex);
        labelMesh.material.map = tex;
        labelMesh.material.needsUpdate = true;
      });
    }

    /* -------------------------------------------------------------
     * 旋轉展示動態控制 (平穩統一 1 圈旋轉，無回彈)
     * ------------------------------------------------------------*/
    let isTouching = false;
    let prevPointerX = 0;
    let prevPointerY = 0;
    let targetRotY = 0;
    let targetRotX = 0;
    let hasMoved = false;

    let isAutoRotating = false;
    let autoRotStartTime = 0;
    const AUTO_ROT_DURATION = 15000;

    function triggerSlow15sSpin() {
      isAutoRotating = true;
      autoRotStartTime = performance.now();
      turntableGroup.rotation.y = 0;
      targetRotY = 0;
      targetRotX = 0;
    }

    function onPointerDown(e) {
      isAutoRotating = false;
      isTouching = true;
      hasMoved = false;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      prevPointerX = clientX;
      prevPointerY = clientY;
    }

    function onPointerMove(e) {
      if (!isTouching) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const deltaX = clientX - prevPointerX;
      const deltaY = clientY - prevPointerY;

      if (Math.abs(deltaX) > 3 || Math.abs(deltaY) > 3) {
        hasMoved = true;
      }

      targetRotY += deltaX * 0.008;
      targetRotX += deltaY * 0.006;
      targetRotX = Math.max(-0.55, Math.min(0.55, targetRotX));

      prevPointerX = clientX;
      prevPointerY = clientY;
    }

    function onPointerUp() {
      if (!hasMoved && isTouching) {
        triggerResetView();
      }
      isTouching = false;
    }

    const stageEl = renderer.domElement;
    stageEl.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    stageEl.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    function triggerResetView() {
      isAutoRotating = false;
      targetRotX = 0;
      targetRotY = 0;
    }

    window.addEventListener('resize', resizeCamera);
    resizeCamera();

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      if (isAutoRotating) {
        const elapsed = performance.now() - autoRotStartTime;
        const progress = Math.min(1, elapsed / AUTO_ROT_DURATION);
        turntableGroup.rotation.y = progress * (Math.PI * 2);
        turntableGroup.rotation.x = THREE.MathUtils.lerp(turntableGroup.rotation.x, 0, 0.08);

        if (progress >= 1) {
          isAutoRotating = false;
          turntableGroup.rotation.y = 0;
          targetRotY = 0;
          targetRotX = 0;
        }
      } else {
        turntableGroup.rotation.y = THREE.MathUtils.lerp(turntableGroup.rotation.y, targetRotY, 0.1);
        turntableGroup.rotation.x = THREE.MathUtils.lerp(turntableGroup.rotation.x, targetRotX, 0.1);
      }

      if (isPlaying) {
        discGroup.rotation.z -= 0.010;
        discGroup.position.x = THREE.MathUtils.lerp(discGroup.position.x, VINYL_OUT_X, 0.06);
      } else {
        discGroup.position.x = THREE.MathUtils.lerp(discGroup.position.x, VINYL_REST_X, 0.06);
      }

      renderer.render(scene, camera);
    }
    renderLoop();

    /* -------------------------------------------------------------
     * 4. 音訊系統

    function setPlayState(active) {
      isPlaying = active;
      const svg = document.getElementById('play-svg-icon');
      if (active) {
        svg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

      }
    }

    function updateProgressUI(cur, total) {
      currentSec = cur;
      totalDuration = total || 211;
      const pct = Math.min(100, Math.max(0, (cur / totalDuration) * 100));
      document.getElementById('seek-progress').style.width = `${pct}%`;
      const curM = Math.floor(cur / 60);
      const curS = Math.floor(cur % 60);
      const totM = Math.floor(totalDuration / 60);
      const totS = Math.floor(totalDuration % 60);
      document.getElementById('lbl-curr').textContent = `${String(curM).padStart(2,'0')}:${String(curS).padStart(2,'0')}`;
      document.getElementById('lbl-total').textContent = `${String(totM).padStart(2,'0')}:${String(totS).padStart(2,'0')}`;
      syncLyrics(cur);
    }

    nativeAudio.addEventListener('timeupdate', () => {
      if (isDraggingSeek) return;
      updateProgressUI(nativeAudio.currentTime, nativeAudio.duration || totalDuration);
    });
    nativeAudio.addEventListener('playing', () => setPlayState(true));
    nativeAudio.addEventListener('pause', () => setPlayState(false));
    nativeAudio.addEventListener('ended', () => {
      playNext();
    });

    function playActiveSong(isNewTrack = false) {
      if (!store || !store[plIdx] || !store[plIdx].songs[trackIdx]) return;
      const curPl = store[plIdx];
      const song = curPl.songs[trackIdx];

      renderUI();
      updateMediaSession(song, curPl);

      document.title = `${song.title} - WINTER PLAYLIST`;

      if (isNewTrack || !hasPlayedFirstTrack) {
        triggerSlow15sSpin();
        hasPlayedFirstTrack = true;
      }

      totalDuration = song.duration || 211;
      const targetVolume = (typeof song.volume === 'number') ? song.volume : (plIdx === 1 ? 1.0 : 0.65);

      let directSrc = song.source.replace(/^\.\//, '');
      if (!directSrc.startsWith('http')) {
        directSrc = CD_PROJECT_BASE + encodeURIComponent(directSrc).replace(/%2F/g, '/');
      } else if (directSrc.includes('github.com') && directSrc.includes('/blob/')) {
        directSrc = directSrc.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
      }

      nativeAudio.volume = Math.min(1.0, Math.max(0, targetVolume));

      if (isNewTrack || nativeAudio.src !== directSrc) {
        currentSec = 0;
        updateProgressUI(0, totalDuration);

        nativeAudio.src = directSrc;
        nativeAudio.currentTime = 0;

        const p = nativeAudio.play();
        if (p !== undefined) {
          p.then(() => {
            setPlayState(true);
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
          }).catch(err => {
            console.log("Audio waiting for gesture:", err);
            setPlayState(false);
          });
        }
      } else {
        if (currentSec > 0 && Math.abs(nativeAudio.currentTime - currentSec) > 1) {
          nativeAudio.currentTime = currentSec;
        }
        const p = nativeAudio.play();
        if (p !== undefined) {
          p.then(() => {
            setPlayState(true);
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
          }).catch(err => {
            console.log("Audio waiting for gesture:", err);
            setPlayState(false);
          });
        }
      }
    }

    function pauseActiveSong() {
      setPlayState(false);
      currentSec = nativeAudio.currentTime;
      nativeAudio.pause();
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = "paused";
      }
    }

    /* -------------------------------------------------------------
     * 5. 進度條拖曳
     * ------------------------------------------------------------*/
    const seekContainer = document.getElementById('seek-container');
    const seekProgress = document.getElementById('seek-progress');

    function getSeekFraction(e) {
      const rect = seekContainer.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const pos = clientX - rect.left;
      return Math.min(1, Math.max(0, pos / rect.width));
    }

    function handleSeekMove(e) {
      if (!isDraggingSeek) return;
      const frac = getSeekFraction(e);
      seekProgress.style.width = `${frac * 100}%`;
      const cur = frac * totalDuration;
      const m = Math.floor(cur / 60);
      const s = Math.floor(cur % 60);
      document.getElementById('lbl-curr').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function handleSeekEnd(e) {
      if (!isDraggingSeek) return;
      isDraggingSeek = false;
      const frac = getSeekFraction(e.changedTouches ? e.changedTouches[0] : e);
      currentSec = frac * totalDuration;

      nativeAudio.currentTime = currentSec;
      updateProgressUI(currentSec, totalDuration);
    }

    seekContainer.addEventListener('mousedown', (e) => { isDraggingSeek = true; handleSeekMove(e); });
    window.addEventListener('mousemove', handleSeekMove);
    window.addEventListener('mouseup', handleSeekEnd);

    seekContainer.addEventListener('touchstart', (e) => { isDraggingSeek = true; handleSeekMove(e); }, { passive: false });
    window.addEventListener('touchmove', handleSeekMove, { passive: false });
    window.addEventListener('touchend', handleSeekEnd);

    /* -------------------------------------------------------------
     * 6. 歌詞渲染
     * ------------------------------------------------------------*/
    function syncLyrics(sec) {
      const song = store[plIdx]?.songs[trackIdx];
      if (!song || !song.lyrics) return;

      let idx = -1;
      for (let i = 0; i < song.lyrics.length; i++) {
        if (sec >= song.lyrics[i].time) idx = i;
        else break;
      }

      const rows = document.querySelectorAll('.lyric-row');
      rows.forEach((r, i) => {
        if (i === idx) {
          if (!r.classList.contains('active')) {
            r.classList.add('active');
            const scroller = document.getElementById('lyrics-scroller');
            scroller.scrollTo({ top: r.offsetTop - (scroller.clientHeight / 2) + 12, behavior: 'smooth' });
          }
        } else {
          r.classList.remove('active');
        }
      });
    }

    function renderLyricsList() {
      const scroller = document.getElementById('lyrics-scroller');
      scroller.innerHTML = '';
      
      scroller.style.scrollBehavior = 'auto';
      scroller.scrollTop = 0;
      setTimeout(() => {
        scroller.style.scrollBehavior = 'smooth';
      }, 50);

      const song = store[plIdx]?.songs[trackIdx];

      if (!song || !song.lyrics || song.lyrics.length === 0) {
        scroller.innerHTML = '<div class="lyric-row"><div class="lyric-primary">純音樂 / Instrumental</div></div>';
        return;
      }

      song.lyrics.forEach(l => {
        const div = document.createElement('div');
        div.className = 'lyric-row';

        const pSpan = document.createElement('div');
        pSpan.className = 'lyric-primary';
        pSpan.textContent = l.text;
        div.appendChild(pSpan);

        if (l.trans) {
          const tSpan = document.createElement('div');
          tSpan.className = 'lyric-trans';
          tSpan.textContent = l.trans;
          div.appendChild(tSpan);
        }

        div.onclick = () => {
          currentSec = l.time;
          nativeAudio.currentTime = currentSec;
          playActiveSong(false);
        };
        scroller.appendChild(div);
      });
    }

    function renderUI() {
      if (!store || !store[plIdx]) return;
      const curPl = store[plIdx];
      const song = curPl.songs[trackIdx];
      if (!song) return;

      document.getElementById('disp-title').textContent = song.title;
      document.getElementById('disp-artist').textContent = song.artist || "WINTER";

      applyCoverTo3D(
        song.cover || curPl.cover, 
        song.backCover, 
        song.labelImg, 
        song.imgScale || 1.0, 
        song.imgOffsetX || 0.0, 
        song.imgOffsetY || 0.0
      );
      renderLyricsList();
      populateDropdowns();
    }

    function playNext() {
      const pl = store[plIdx];
      if (!pl || pl.songs.length === 0) return;
      trackIdx = (trackIdx + 1) % pl.songs.length;
      currentSec = 0;
      playActiveSong(true);
    }

    function playPrev() {
      const pl = store[plIdx];
      if (!pl || pl.songs.length === 0) return;
      trackIdx = (trackIdx - 1 + pl.songs.length) % pl.songs.length;
      currentSec = 0;
      playActiveSong(true);
    }

    document.getElementById('btn-play').onclick = () => {
      if (isPlaying) {
        pauseActiveSong();
      } else {
        playActiveSong(false);
      }
    };
    document.getElementById('btn-next').onclick = playNext;
    document.getElementById('btn-prev').onclick = playPrev;

    function populateDropdowns() {
      const pSel = document.getElementById('sel-playlist');
      pSel.innerHTML = '';
      store.forEach((p, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = p.name;
        if (i === plIdx) opt.selected = true;
        pSel.appendChild(opt);
      });

      const sSel = document.getElementById('sel-song');
      sSel.innerHTML = '';
      const songs = store[plIdx]?.songs || [];
      songs.forEach((s, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = s.title;
        if (i === trackIdx) opt.selected = true;
        sSel.appendChild(opt);
      });
    }

    document.getElementById('sel-playlist').onchange = (e) => {
      plIdx = parseInt(e.target.value);
      trackIdx = 0;
      currentSec = 0;
      playActiveSong(true);
    };

    document.getElementById('sel-song').onchange = (e) => {
      trackIdx = parseInt(e.target.value);
      currentSec = 0;
      playActiveSong(true);
    };

    /* -------------------------------------------------------------
     * 7. 導覽選單與管理後台控制
     * ------------------------------------------------------------*/
    const navModal = document.getElementById('nav-modal');
    const mountPoint = document.getElementById('admin-mount-point');

    document.getElementById('btn-open-menu').onclick = () => {
      navModal.style.display = 'flex';
    };
    document.getElementById('btn-close-nav').onclick = () => {
      navModal.style.display = 'none';
    };

    document.getElementById('menu-btn-reset').onclick = () => {
      localStorage.removeItem('winter_playlist_store_v75');
      window.location.reload();
    };

    document.getElementById('menu-btn-admin').onclick = () => {
      navModal.style.display = 'none';
      openAuthModal();
    };

    function openAuthModal() {
      mountPoint.innerHTML = document.getElementById('auth-tpl').innerHTML;
      const authInput = document.getElementById('auth-input');
      authInput.focus();

      document.getElementById('btn-auth-close').onclick = () => { mountPoint.innerHTML = ''; };
      document.getElementById('btn-auth-submit').onclick = () => {
        if (authInput.value === '0401') {
          openAdminDashboard();
        } else {
          alert('驗證失敗！');
        }
      };
    }

    document.getElementById('logo-trigger').onclick = openAuthModal;

    function updateLivePreviewBox() {
      const title = document.getElementById('form-song-title')?.value.trim() || '未命名歌曲';
      const artist = document.getElementById('form-song-artist')?.value.trim() || 'WINTER';
      const rawCover = document.getElementById('form-song-cover')?.value.trim() || COVER_LIPS;
      const direct = normalizeImageUrl(rawCover);

      const scale = parseFloat(document.getElementById('form-img-scale')?.value || 1.0);
      const ox = parseFloat(document.getElementById('form-img-ox')?.value || 0.0);
      const oy = parseFloat(document.getElementById('form-img-oy')?.value || 0.0);

      const thumbEl = document.getElementById('preview-box-thumb');
      const titleEl = document.getElementById('preview-box-title');
      const artistEl = document.getElementById('preview-box-artist');

      if (titleEl) titleEl.textContent = title;
      if (artistEl) artistEl.textContent = artist;
      if (thumbEl) {
        thumbEl.style.backgroundImage = `url("${direct}")`;
        thumbEl.style.backgroundSize = `${scale * 100}%`;
        thumbEl.style.backgroundPosition = `${50 + ox * 100}% ${50 + oy * 100}%`;
      }
    }

    function openAdminDashboard() {
      mountPoint.innerHTML = document.getElementById('admin-tpl').innerHTML;

      const scaleSlider = document.getElementById('scale-slider');
      scaleSlider.value = modelScale;
      document.getElementById('scale-val-lbl').textContent = `${modelScale}x`;
      scaleSlider.oninput = (e) => {
        modelScale = parseFloat(e.target.value);
        document.getElementById('scale-val-lbl').textContent = `${modelScale}x`;
        turntableGroup.scale.set(modelScale, modelScale, modelScale);
      };

      const volSlider = document.getElementById('form-song-vol');
      volSlider.oninput = (e) => {
        document.getElementById('form-vol-lbl').textContent = `${parseFloat(e.target.value).toFixed(2)}x`;
      };

      const imgScale = document.getElementById('form-img-scale');
      const imgOx = document.getElementById('form-img-ox');
      const imgOy = document.getElementById('form-img-oy');

      imgScale.oninput = (e) => {
        document.getElementById('lbl-img-scale').textContent = `${parseFloat(e.target.value).toFixed(2)}x`;
        updateLivePreviewBox();
      };
      imgOx.oninput = (e) => {
        document.getElementById('lbl-img-ox').textContent = `${Math.round(e.target.value * 100)}%`;
        updateLivePreviewBox();
      };
      imgOy.oninput = (e) => {
        document.getElementById('lbl-img-oy').textContent = `${Math.round(e.target.value * 100)}%`;
        updateLivePreviewBox();
      };

      document.getElementById('form-song-title').oninput = updateLivePreviewBox;
      document.getElementById('form-song-artist').oninput = updateLivePreviewBox;
      document.getElementById('form-song-cover').oninput = updateLivePreviewBox;

      document.getElementById('btn-pick-img').onclick = () => document.getElementById('local-img-picker').click();
      document.getElementById('local-img-picker').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          document.getElementById('form-song-cover').value = event.target.result;
          document.getElementById('img-picker-status').textContent = `已載入: ${file.name}`;
          updateLivePreviewBox();
        };
        reader.readAsDataURL(file);
      };

      document.getElementById('btn-pick-label-img').onclick = () => document.getElementById('local-label-img-picker').click();
      document.getElementById('local-label-img-picker').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          document.getElementById('form-song-label-img').value = event.target.result;
          document.getElementById('label-img-picker-status').textContent = `已載入: ${file.name}`;
        };
        reader.readAsDataURL(file);
      };

      document.getElementById('btn-pick-back-img').onclick = () => document.getElementById('local-back-img-picker').click();
      document.getElementById('local-back-img-picker').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          document.getElementById('form-song-back-cover').value = event.target.result;
          document.getElementById('back-img-picker-status').textContent = `已載入: ${file.name}`;
        };
        reader.readAsDataURL(file);
      };

      document.getElementById('btn-close-admin').onclick = () => {
        mountPoint.innerHTML = '';
        persistData();
        renderUI();
      };

      document.getElementById('btn-save-song').onclick = saveSongHandler;
      document.getElementById('btn-cancel-edit').onclick = resetSongForm;
      document.getElementById('btn-add-pl').onclick = addPlaylistHandler;

      document.getElementById('btn-copy-code').onclick = () => {
        navigator.clipboard.writeText(document.documentElement.outerHTML).then(() => {
          alert('已將當前完整 HTML 程式碼複製到剪貼簿！');
        });
      };

      document.getElementById('btn-dl-html').onclick = () => {
        const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'index.html';
        a.click();
      };

      renderAdminTree();
      updateLivePreviewBox();
    }

    function renderAdminTree() {
      const targetPlSel = document.getElementById('form-pl-target');
      if (!targetPlSel) return;
      targetPlSel.innerHTML = '';
      store.forEach((p, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = p.name;
        targetPlSel.appendChild(opt);
      });

      const tree = document.getElementById('admin-tree-view');
      tree.innerHTML = '';
      store.forEach((p, pI) => {
        const pBox = document.createElement('div');
        pBox.style.cssText = "margin-bottom:12px; background:#111216; padding:10px; border-radius:6px; border:1px solid #282a35;";
        
        const isFirstPl = pI === 0;
        const isLastPl = pI === store.length - 1;

        pBox.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom:1px solid #222530; padding-bottom:6px;">
            <strong style="color:#e4e4e7; font-size:0.84rem;">📁 ${p.name} (${p.songs.length} 首)</strong>
            <div style="display:flex; gap:4px;">
              <button class="btn-order" onclick="window.movePl(${pI}, -1)" ${isFirstPl ? 'disabled' : ''} title="上移歌單">⬆</button>
              <button class="btn-order" onclick="window.movePl(${pI}, 1)" ${isLastPl ? 'disabled' : ''} title="下移歌單">⬇</button>
              <button class="btn-act btn-del" onclick="window.delPl(${pI})" style="margin-left:4px;">刪除歌單</button>
            </div>
          </div>
        `;

        p.songs.forEach((s, sI) => {
          const isFirstSong = sI === 0;
          const isLastSong = sI === p.songs.length - 1;
          const volDisplay = typeof s.volume === 'number' ? s.volume : (pI === 1 ? 1.0 : 0.65);

          const sRow = document.createElement('div');
          sRow.className = 'song-item-row';
          sRow.innerHTML = `
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px;">🎵 ${sI + 1}. ${s.title} <small style="color:#71717a;">(${volDisplay.toFixed(2)}x)</small></span>
            <div class="song-actions">
              <button class="btn-order" onclick="window.moveSong(${pI}, ${sI}, -1)" ${isFirstSong ? 'disabled' : ''} title="上移">⬆</button>
              <button class="btn-order" onclick="window.moveSong(${pI}, ${sI}, 1)" ${isLastSong ? 'disabled' : ''} title="下移">⬇</button>
              <button class="btn-act btn-edit" onclick="window.editS(${pI}, ${sI})">編輯</button>
              <button class="btn-act btn-del" onclick="window.delS(${pI}, ${sI})">刪除</button>
            </div>
          `;
          pBox.appendChild(sRow);
        });
        tree.appendChild(pBox);
      });
    }

    window.movePl = (pI, dir) => {
      const targetIndex = pI + dir;
      if (targetIndex < 0 || targetIndex >= store.length) return;
      const temp = store[pI];
      store[pI] = store[targetIndex];
      store[targetIndex] = temp;
      if (plIdx === pI) plIdx = targetIndex;
      else if (plIdx === targetIndex) plIdx = pI;
      persistData();
      renderAdminTree();
      renderUI();
    };

    window.moveSong = (pI, sI, dir) => {
      const songs = store[pI].songs;
      const targetIndex = sI + dir;
      if (targetIndex < 0 || targetIndex >= songs.length) return;
      const temp = songs[sI];
      songs[sI] = songs[targetIndex];
      songs[targetIndex] = temp;
      if (plIdx === pI) {
        if (trackIdx === sI) trackIdx = targetIndex;
        else if (trackIdx === targetIndex) trackIdx = sI;
      }
      persistData();
      renderAdminTree();
      renderUI();
    };

    window.delPl = (pI) => {
      if (store.length <= 1) return alert('請至少保留一個歌單！');
      if (confirm(`確定刪除歌單《${store[pI].name}》？`)) {
        store.splice(pI, 1);
        if (plIdx >= store.length) plIdx = 0;
        trackIdx = 0;
        persistData();
        renderAdminTree();
        renderUI();
      }
    };

    window.delS = (pI, sI) => {
      store[pI].songs.splice(sI, 1);
      if (plIdx === pI && trackIdx >= store[pI].songs.length) {
        trackIdx = Math.max(0, store[pI].songs.length - 1);
      }
      persistData();
      renderAdminTree();
      renderUI();
    };

    window.editS = (pI, sI) => {
      const s = store[pI].songs[sI];
      document.getElementById('form-mode-title').textContent = `✦ 編輯歌曲: ${s.title}`;
      document.getElementById('edit-song-id').value = `${pI}_${sI}`;
      document.getElementById('form-pl-target').value = pI;
      document.getElementById('form-song-title').value = s.title;
      document.getElementById('form-song-artist').value = s.artist || 'WINTER';
      document.getElementById('form-song-source').value = s.source;

      const currentVol = (typeof s.volume === 'number') ? s.volume : (pI === 1 ? 1.0 : 0.65);
      document.getElementById('form-song-vol').value = currentVol;
      document.getElementById('form-vol-lbl').textContent = `${currentVol.toFixed(2)}x`;

      const currentScale = typeof s.imgScale === 'number' ? s.imgScale : 1.0;
      const currentOx = typeof s.imgOffsetX === 'number' ? s.imgOffsetX : 0.0;
      const currentOy = typeof s.imgOffsetY === 'number' ? s.imgOffsetY : 0.0;

      document.getElementById('form-img-scale').value = currentScale;
      document.getElementById('lbl-img-scale').textContent = `${currentScale.toFixed(2)}x`;
      document.getElementById('form-img-ox').value = currentOx;
      document.getElementById('lbl-img-ox').textContent = `${Math.round(currentOx * 100)}%`;
      document.getElementById('form-img-oy').value = currentOy;
      document.getElementById('lbl-img-oy').textContent = `${Math.round(currentOy * 100)}%`;

      document.getElementById('form-song-cover').value = s.cover || '';
      document.getElementById('form-song-label-img').value = s.labelImg || '';
      document.getElementById('form-song-back-cover').value = s.backCover || '';

      const lyricsStr = (s.lyrics || []).map(l => {
        let textPart = `${formatLrcTime(l.time)} ${l.text}`;
        if (l.trans) textPart += `\n${l.trans}`;
        return textPart;
      }).join('\n');
      document.getElementById('form-song-lyrics').value = lyricsStr;

      document.getElementById('btn-cancel-edit').style.display = 'inline-block';
      document.getElementById('admin-modal').scrollTo({ top: 0, behavior: 'smooth' });

      updateLivePreviewBox();
    };

    function resetSongForm() {
      document.getElementById('form-mode-title').textContent = '✦ 新增歌曲';
      document.getElementById('edit-song-id').value = '';
      document.getElementById('form-song-title').value = '';
      document.getElementById('form-song-artist').value = 'WINTER';
      document.getElementById('form-song-source').value = '';
      document.getElementById('form-song-vol').value = 1.0;
      document.getElementById('form-vol-lbl').textContent = '1.00x';

      document.getElementById('form-img-scale').value = 1.0;
      document.getElementById('lbl-img-scale').textContent = '1.00x';
      document.getElementById('form-img-ox').value = 0.0;
      document.getElementById('lbl-img-ox').textContent = '0%';
      document.getElementById('form-img-oy').value = 0.0;
      document.getElementById('lbl-img-oy').textContent = '0%';

      document.getElementById('form-song-cover').value = '';
      document.getElementById('form-song-label-img').value = '';
      document.getElementById('form-song-back-cover').value = '';
      document.getElementById('form-song-lyrics').value = '';
      document.getElementById('img-picker-status').textContent = '';
      document.getElementById('label-img-picker-status').textContent = '';
      document.getElementById('back-img-picker-status').textContent = '';
      document.getElementById('btn-cancel-edit').style.display = 'none';

      updateLivePreviewBox();
    }

    function saveSongHandler() {
      const editKey = document.getElementById('edit-song-id').value;
      const targetPl = parseInt(document.getElementById('form-pl-target').value);
      const title = document.getElementById('form-song-title').value.trim();
      const artist = document.getElementById('form-song-artist').value.trim() || 'WINTER';
      const source = document.getElementById('form-song-source').value.trim();
      const volume = parseFloat(document.getElementById('form-song-vol').value) || 1.0;
      const imgScale = parseFloat(document.getElementById('form-img-scale').value) || 1.0;
      const imgOffsetX = parseFloat(document.getElementById('form-img-ox').value) || 0.0;
      const imgOffsetY = parseFloat(document.getElementById('form-img-oy').value) || 0.0;

      const rawCover = document.getElementById('form-song-cover').value.trim();
      const rawLabelImg = document.getElementById('form-song-label-img').value.trim();
      const rawBackCover = document.getElementById('form-song-back-cover').value.trim();
      
      const cover = normalizeImageUrl(rawCover) || store[targetPl]?.cover || COVER_LIPS;
      const labelImg = normalizeImageUrl(rawLabelImg) || '';
      const backCover = normalizeImageUrl(rawBackCover) || '';
      const lyricsRaw = document.getElementById('form-song-lyrics').value;

      if (!title || !source) return alert('請填寫完整歌名與音訊來源！');

      const songObj = {
        title,
        artist,
        source,
        volume,
        cover,
        labelImg,
        backCover,
        imgScale,
        imgOffsetX,
        imgOffsetY,
        duration: 210,
        lyrics: parseLrc(lyricsRaw)
      };

      if (editKey) {
        const [oldPI, oldSI] = editKey.split('_').map(Number);
        if (oldPI === targetPl) {
          store[oldPI].songs[oldSI] = songObj;
        } else {
          store[oldPI].songs.splice(oldSI, 1);
          store[targetPl].songs.push(songObj);
        }
      } else {
        store[targetPl].songs.push(songObj);
      }

      persistData();
      renderAdminTree();
      renderUI();
      resetSongForm();
      alert(`歌曲《${title}》已成功儲存！`);
    }

    function addPlaylistHandler() {
      const name = document.getElementById('admin-new-pl-name').value.trim();
      if (!name) return alert('請輸入歌單名稱！');
      store.push({ id: 'pl_' + Date.now(), name, cover: COVER_LIPS, songs: [] });
      document.getElementById('admin-new-pl-name').value = '';
      persistData();
      renderAdminTree();
      renderUI();
    }

    // 初始化渲染
    renderUI();
    
    // 預先掛載第一首音訊
    if (store && store[plIdx] && store[plIdx].songs && store[plIdx].songs[trackIdx]) {
      const firstSong = store[plIdx].songs[trackIdx];
      let firstSrc = firstSong.source.replace(/^\.\//, '');
      if (!firstSrc.startsWith('http')) {
        firstSrc = CD_PROJECT_BASE + encodeURIComponent(firstSrc).replace(/%2F/g, '/');
      }
      nativeAudio.src = firstSrc;
      updateMediaSession(firstSong, store[plIdx]);
    }
  </script>
</body>
</html>
